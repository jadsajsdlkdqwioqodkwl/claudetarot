<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --teal:#068988; --ink:#111; --muted:#666; --line:#E0E0E0; --green:#28A745; --rojo:#C62828; }
  * { box-sizing:border-box; }
  body { font-family:Inter,-apple-system,'Segoe UI',Arial,sans-serif; color:var(--ink);
         margin:0; padding:18px 20px; font-size:14px; line-height:1.45; }
  .quien { color:var(--muted); font-size:12.5px; margin-bottom:14px; }
  .quien b { color:var(--ink); }

  .zona { border:2px dashed var(--line); border-radius:12px; padding:26px 16px; text-align:center;
          cursor:pointer; transition:border-color .15s, background .15s; }
  .zona:hover { border-color:var(--teal); background:#f6fbfb; }
  .zona .icono { font-size:30px; line-height:1; }
  .zona .txt { font-weight:700; margin-top:9px; }
  .zona .hint { color:var(--muted); font-size:12px; margin-top:4px; }
  input[type=file] { display:none; }

  #previa { display:none; margin-top:14px; text-align:center; }
  #previa img { max-width:100%; max-height:190px; border-radius:10px; border:1.5px solid var(--line); }
  #peso { color:var(--muted); font-size:12px; margin-top:7px; }

  button { width:100%; margin-top:15px; padding:13px; border:none; border-radius:10px;
           font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer; }
  #enviar { background:var(--teal); color:#fff; }
  #enviar:disabled { background:#c9d3d3; cursor:not-allowed; }

  .aviso { margin-top:13px; padding:11px 13px; border-radius:9px; font-size:13px;
           font-weight:600; display:none; }
  .aviso.ok { display:block; background:#e6f9ec; color:var(--green); }
  .aviso.mal { display:block; background:#fdecea; color:var(--rojo); }
</style>
</head>
<body>

<p class="quien">Voucher de <b><?= cliente ?></b> · <?= codigo ?></p>

<label class="zona" id="zona">
  <div class="icono">📷</div>
  <div class="txt">Elige la foto del voucher</div>
  <div class="hint">JPG, PNG o WEBP</div>
  <input type="file" id="archivo" accept="image/*">
</label>

<div id="previa">
  <img id="miniatura" alt="">
  <div id="peso"></div>
</div>

<button id="enviar" disabled>Subir voucher</button>
<div class="aviso" id="aviso"></div>

<script>
  var CODIGO = <?= JSON.stringify(codigo) ?>;

  /** Lado máximo de la foto que se sube. Un voucher se lee de sobra a 1600px. */
  var MAX_LADO = 1600;
  var CALIDAD = 0.82;

  var $ = function (id) { return document.getElementById(id); };
  var listo = null;

  function avisar(texto, mal) {
    var caja = $("aviso");
    caja.className = "aviso " + (mal ? "mal" : "ok");
    caja.textContent = texto;
  }

  /**
   * Reduce la foto antes de mandarla. Una foto de celular pesa 4–8 MB y viaja
   * a Apps Script en base64, que la infla un tercio más: sin esto, la subida
   * tarda una eternidad con mala señal y a veces se corta a la mitad.
   */
  function encoger(archivo, cuandoEste) {
    var lector = new FileReader();
    lector.onload = function () {
      var img = new Image();
      img.onload = function () {
        var escala = Math.min(1, MAX_LADO / Math.max(img.width, img.height));
        var lienzo = document.createElement("canvas");
        lienzo.width = Math.round(img.width * escala);
        lienzo.height = Math.round(img.height * escala);
        lienzo.getContext("2d").drawImage(img, 0, 0, lienzo.width, lienzo.height);
        var url = lienzo.toDataURL("image/jpeg", CALIDAD);
        cuandoEste({ base64: url.split(",")[1], mime: "image/jpeg", url: url });
      };
      // Un archivo que el navegador no sabe dibujar (un HEIC, un PDF con
      // extensión cambiada) se manda tal cual y que lo rechace el servidor.
      img.onerror = function () {
        cuandoEste({
          base64: String(lector.result).split(",")[1],
          mime: archivo.type,
          url: lector.result
        });
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  }

  $("archivo").addEventListener("change", function () {
    var archivo = this.files && this.files[0];
    if (!archivo) return;

    avisar("", false);
    $("aviso").className = "aviso";
    $("enviar").disabled = true;
    $("enviar").textContent = "Preparando la foto…";

    encoger(archivo, function (resultado) {
      listo = resultado;
      $("miniatura").src = resultado.url;
      $("peso").textContent =
        Math.round((resultado.base64.length * 3) / 4 / 1024) + " KB listos para subir";
      $("previa").style.display = "block";
      $("enviar").disabled = false;
      $("enviar").textContent = "Subir voucher";
    });
  });

  $("enviar").addEventListener("click", function () {
    if (!listo) return;
    this.disabled = true;
    this.textContent = "Subiendo…";

    google.script.run
      .withSuccessHandler(function (mensaje) {
        avisar(mensaje, false);
        $("enviar").textContent = "Listo";
        setTimeout(function () { google.script.host.close(); }, 1600);
      })
      .withFailureHandler(function (err) {
        avisar(err && err.message ? err.message : "No se pudo subir la foto.", true);
        $("enviar").disabled = false;
        $("enviar").textContent = "Reintentar";
      })
      .guardarVoucherVenta(CODIGO, listo.base64, listo.mime, "voucher.jpg");
  });
</script>
</body>
</html>
