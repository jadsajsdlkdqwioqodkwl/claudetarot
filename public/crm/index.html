<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>CRM WhatsApp</title>
<link rel="stylesheet" href="/crm/style.css" />
</head>
<body>

<div id="login">
  <form id="form-login">
    <h1>CRM · WhatsApp</h1>
    <div class="error" id="login-error"></div>
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required />
    <input type="text" id="code" placeholder="Código de 6 dígitos" inputmode="numeric" maxlength="6" style="display:none" />
    <div class="ayuda" id="ayuda-2fa" style="display:none">Abre tu app de autenticación (Google Authenticator, Authy…)</div>
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="app">
  <section id="lista">
    <header>
      <h1>Chats</h1>
      <div class="acciones">
        <button id="btn-salir">Salir</button>
      </div>
    </header>
    <div id="buscador"><input type="text" id="buscar" placeholder="Buscar contacto…" /></div>
    <div id="filtros">
      <button data-follow="" class="activo">Todos</button>
      <button data-follow="1">★ Seguimiento</button>
    </div>
    <div id="conversaciones"></div>
  </section>

  <section id="chat">
    <div id="vacio">Elige una conversación</div>
  </section>

  <aside id="detalle"></aside>
</div>

<div class="modal-fondo" id="modal-rapida-fondo">
  <div class="modal">
    <h2>Nueva respuesta rápida</h2>
    <input type="text" id="rapida-titulo" placeholder="Título (ej. Precio, Horario…)" />
    <textarea id="rapida-texto" placeholder="Texto del mensaje (opcional si adjuntas un archivo)"></textarea>
    <input type="file" id="rapida-archivo" accept="image/*,video/*" />
    <div class="acciones">
      <button class="cancelar" id="rapida-cancelar" type="button">Cancelar</button>
      <button class="crear" id="rapida-crear" type="button">Guardar</button>
    </div>
  </div>
</div>

<script src="/crm/app.js"></script>
</body>
</html>
