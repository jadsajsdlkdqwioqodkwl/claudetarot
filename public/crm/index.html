<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>CRM WhatsApp</title>
<style>
  :root{
    --verde:#25D366; --verde-osc:#128C7E; --fondo:#f0f2f5; --panel:#fff;
    --borde:#e9edef; --texto:#111b21; --gris:#667781; --burbuja-out:#d9fdd3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--texto)}
  #login{display:flex;align-items:center;justify-content:center;height:100vh}
  #login form{background:var(--panel);padding:32px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.15);width:280px}
  #login h1{font-size:18px;margin:0 0 16px}
  #login input{width:100%;padding:10px;border:1px solid var(--borde);border-radius:6px;font-size:14px;margin-bottom:12px}
  #login button{width:100%;padding:10px;border:0;border-radius:6px;background:var(--verde-osc);color:#fff;font-size:14px;cursor:pointer}
  #login .error{color:#d33;font-size:13px;margin-bottom:8px;min-height:16px}

  #app{display:none;height:100vh;grid-template-columns:340px 1fr 300px}
  #app.activo{display:grid}

  #lista{background:var(--panel);border-right:1px solid var(--borde);display:flex;flex-direction:column;overflow:hidden}
  #lista header{padding:14px 16px;background:var(--verde-osc);color:#fff;display:flex;justify-content:space-between;align-items:center}
  #lista header h1{font-size:16px;margin:0}
  #lista header button{background:transparent;border:0;color:#fff;cursor:pointer;font-size:13px;opacity:.85}
  #buscador{padding:8px 10px;border-bottom:1px solid var(--borde)}
  #buscador input{width:100%;padding:8px 10px;border-radius:20px;border:1px solid var(--borde);background:var(--fondo);font-size:13px}
  #filtros{display:flex;gap:4px;padding:6px 10px;overflow-x:auto;border-bottom:1px solid var(--borde)}
  #filtros button{border:1px solid var(--borde);background:#fff;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--gris)}
  #filtros button.activo{background:var(--verde);color:#fff;border-color:var(--verde)}
  #conversaciones{overflow-y:auto;flex:1}
  .conv-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--borde);cursor:pointer}
  .conv-item:hover{background:#f5f6f6}
  .conv-item.activo{background:#e9edef}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--verde-osc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
  .conv-info{flex:1;min-width:0}
  .conv-info .fila1{display:flex;justify-content:space-between;font-size:14px}
  .conv-info .nombre{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv-info .hora{font-size:11px;color:var(--gris)}
  .conv-info .fila2{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
  .conv-info .preview{font-size:13px;color:var(--gris);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
  .badge{background:var(--verde);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;min-width:8px;text-align:center}
  .etiqueta{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#e2e8f0;color:#475569;margin-top:3px}

  #chat{display:flex;flex-direction:column;background:#e5ddd5}
  #chat header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--borde);display:flex;align-items:center;gap:10px}
  #chat header .nombre{font-weight:600;font-size:15px}
  #chat header .tel{font-size:12px;color:var(--gris)}
  #mensajes{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
  .msg{max-width:65%;padding:7px 10px;border-radius:8px;font-size:14px;line-height:1.4;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .msg.in{background:#fff;align-self:flex-start;border-top-left-radius:0}
  .msg.out{background:var(--burbuja-out);align-self:flex-end;border-top-right-radius:0}
  .msg .hora{display:block;font-size:10px;color:var(--gris);margin-top:3px;text-align:right}
  .msg .tipo{font-style:italic;color:var(--gris)}
  #vacio{flex:1;display:flex;align-items:center;justify-content:center;color:var(--gris);font-size:14px}
  #form-envio{display:flex;gap:8px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--borde)}
  #form-envio input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid var(--borde);font-size:14px}
  #form-envio button{background:var(--verde);color:#fff;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:16px}
  #form-envio button:disabled{opacity:.5;cursor:default}

  #detalle{background:var(--panel);border-left:1px solid var(--borde);padding:16px;overflow-y:auto}
  #detalle h2{font-size:14px;color:var(--gris);text-transform:uppercase;margin:16px 0 6px}
  #detalle h2:first-child{margin-top:0}
  #detalle .avatar{width:64px;height:64px;font-size:22px;margin:0 auto 10px}
  #detalle .nombre-contacto{text-align:center;font-weight:600;font-size:16px}
  #detalle .tel-contacto{text-align:center;color:var(--gris);font-size:13px;margin-bottom:6px}
  #detalle select, #detalle textarea, #detalle input{width:100%;padding:8px;border:1px solid var(--borde);border-radius:6px;font-size:13px;font-family:inherit}
  #detalle textarea{resize:vertical;min-height:70px}
  #detalle button.guardar{margin-top:8px;width:100%;padding:8px;border:0;border-radius:6px;background:var(--verde-osc);color:#fff;cursor:pointer;font-size:13px}

  @media (max-width: 900px){
    #app{grid-template-columns:1fr}
    #detalle{display:none}
  }
</style>
</head>
<body>

<div id="login">
  <form id="form-login">
    <h1>CRM · WhatsApp</h1>
    <div class="error" id="login-error"></div>
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required />
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="app">
  <section id="lista">
    <header>
      <h1>Chats</h1>
      <button id="btn-salir">Salir</button>
    </header>
    <div id="buscador"><input type="text" id="buscar" placeholder="Buscar contacto…" /></div>
    <div id="filtros">
      <button data-stage="" class="activo">Todos</button>
      <button data-stage="nuevo">Nuevo</button>
      <button data-stage="contactado">Contactado</button>
      <button data-stage="negociando">Negociando</button>
      <button data-stage="ganado">Ganado</button>
      <button data-stage="perdido">Perdido</button>
    </div>
    <div id="conversaciones"></div>
  </section>

  <section id="chat">
    <div id="vacio">Elige una conversación</div>
  </section>

  <aside id="detalle"></aside>
</div>

<script src="/crm/app.js"></script>
</body>
</html>
